<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taco — The Autonomous Casualty Office</title>
    <meta
      name="description"
      content="Taco runs pre-deployment audits on robot policies, finds replayable failure modes, profiles internal risk traces, and issues conditional deployment certificates."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232b2622'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' fill='%23f7f5f0' text-anchor='middle'%3E%E2%97%88%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- SPA redirect decode for GitHub Pages (pairs with public/404.html) -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
